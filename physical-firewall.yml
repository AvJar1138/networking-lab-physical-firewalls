name: iptables-firewall-lab

topology:
  nodes:
    # Alpine Linux Firewall Router
    router:
      kind: linux
      image: alpine:latest
      # TODO: Complete mounts, package installations, IP definitions, and firewall commands
      exec:
        - apk add --no-cache iptables
        - sysctl -w net.ipv4.ip_forward=1
        - ip addr replace 10.1.1.1/24 dev eth1
        - ip addr replace 192.168.10.1/24 dev eth2
        - ip addr replace 172.16.1.1/24 dev eth3
        - ip addr replace 172.16.1.2/24 dev eth4
        
        # Default Policies
        - iptables -P INPUT DROP
        - iptables -P FORWARD DROP
        - iptables -P OUTPUT ACCEPT

        # 1. Allow Established & Related Traffic
        - iptables -A INPUT -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT
        - iptables -A FORWARD -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT

        # 2. Blacklist / Threat Mitigation
        - iptables -A FORWARD -s 172.16.1.200 -j DROP
        - iptables -A INPUT -m conntrack --ctstate INVALID -j DROP
        - iptables -A FORWARD -m conntrack --ctstate INVALID -j DROP

        # 3. LAN to DMZ & WAN Access
        - iptables -A FORWARD -s 10.1.1.0/24 -d 192.168.10.0/24 -p tcp -m multiport --dports 80,443 -m conntrack --ctstate NEW -j ACCEPT
        - iptables -A FORWARD -s 10.1.1.0/24 -d 172.16.1.0/24 -p tcp -m multiport --dports 80,443 -m conntrack --ctstate NEW -j ACCEPT

        # 4. WAN to DMZ Access
        - iptables -A FORWARD -s 172.16.1.0/24 -d 192.168.10.10/32 -p tcp --dport 80 -m conntrack --ctstate NEW -j ACCEPT
        - iptables -A FORWARD -s 172.16.1.0/24 -d 192.168.10.10/32 -p tcp --dport 443 -m conntrack --ctstate NEW -j ACCEPT

    # LAN Client
    lan-client:
      kind: linux
      image: alpine:latest
      # TODO: Configure IP address (10.1.1.10/24) and default gateway route
      exec:
        - apk add --no-cache curl netcat-openbsd
        - ip addr add 10.1.1.10/24 dev eth1
        - ip route replace default via 10.1.1.1 dev eth1

    # DMZ Web Server
    dmz-server:
      kind: linux
      image: nginx:alpine
      # TODO: Configure IP address (192.168.10.10/24) and default gateway route
      binds:
        - config/index.html:/usr/share/nginx/html/index.html:ro
      exec:
        - ip addr add 192.168.10.10/24 dev eth1
        - ip route replace default via 192.168.10.1 dev eth1   

    # WAN External Client
    wan-client:
      kind: linux
      image: alpine:latest
      # TODO: Configure IP address (172.16.1.100/24) and default gateway route
      exec:
        - apk add --no-cache curl netcat-openbsd
        - ip addr add 172.16.1.100/24 dev eth1
        - ip route replace default via 172.16.1.1 dev eth1

    # WAN Attacker / Blacklisted Host
    wan-attacker:
      kind: linux
      image: alpine:latest
      # TODO: Configure IP address (172.16.1.200/24) and default gateway route
      exec:
        - apk add --no-cache curl netcat-openbsd
        - ip addr add 172.16.1.200/24 dev eth1
        - ip route replace default via 172.16.1.2 dev eth1

  links:
    # TODO: Define interface connections between nodes matching the topology map
    - endpoints: ["router:eth1", "lan-client:eth1"]
    - endpoints: ["router:eth2", "dmz-server:eth1"]
    - endpoints: ["router:eth3", "wan-client:eth1"]
    - endpoints: ["router:eth4", "wan-attacker:eth1"]
